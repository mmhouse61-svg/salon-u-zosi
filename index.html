<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Salon u Róży">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff8fb8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Salon u Róży</title>
<style>
  :root {
    --rozowy: #ff8fb8;
    --jasny: #ffe3ef;
    --mietowy: #bdeedd;
    --tekst: #5a2a47;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: var(--jasny); font-family: "Trebuchet MS", system-ui, sans-serif; color: var(--tekst); }
  .ekran { position: absolute; inset: 0; display: none; }
  .ekran.aktywny { display: block; }

  /* Ekran 1: start */
  #start { background: linear-gradient(var(--jasny), #ffc9de); text-align: center; }
  #start.aktywny { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #start h1 { margin: 0; font-size: clamp(36px, 7vw, 84px); line-height: 1.1; }
  #start .podtytul { font-size: clamp(18px, 3vw, 32px); margin: 0; }
  #start .zosia { height: 36vh; width: auto; max-width: 60vw; }
  .guzik {
    display: inline-block; border: 0; border-radius: 999px; background: var(--rozowy); color: #fff;
    font: inherit; font-weight: bold; font-size: clamp(28px, 5vw, 56px);
    padding: 0.35em 1.4em; box-shadow: 0 8px 0 #d85c8c; cursor: pointer;
  }
  .guzik:active { transform: translateY(6px); box-shadow: 0 2px 0 #d85c8c; }
  #start .guzik { margin: 0 0 1vh; }
  #start .guzik.maly { margin: 0 0 3vh; }

  /* Ekran 2: klient wchodzi */
  #klient, #koniec { overflow: hidden; background: #ffc9de; }
  .tablica { position: absolute; top: 3vh; left: 50%; transform: translateX(-50%); font-size: clamp(18px, 3vw, 34px); background: #fff; border: 4px solid var(--rozowy); border-radius: 18px; padding: 0.3em 1em; }
  /* salon: tło 4:3 zakotwiczone przy dole; wszystko w nim w % tła, więc postacie zawsze stoją za ladą */
  .salon { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: max(100vw, 133.333vh); aspect-ratio: 1448 / 1086; }
  .salon-tlo { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .salon-lada { position: absolute; left: 0; bottom: 0; width: 100%; display: block; pointer-events: none; }
  .zosia-s { position: absolute; left: 9%; bottom: 23%; height: 39%; width: auto; display: block; }
  .salon .klient { height: auto; width: 26.4%; aspect-ratio: 650 / 845; position: absolute; bottom: 23%; }
  #gosc { left: 110%; transition: left 2.2s ease-in-out; }
  #gosc.wszedl { left: 57%; }
  #gosc.w-fotelu { left: 57%; opacity: 0; transition: opacity 1s; }
  #koniecKlient { left: 57%; }
  .salon .kot { width: 9%; }
  #dymek {
    position: absolute; left: 50%; top: 14vh; transform: translateX(-50%); max-width: 80vw;
    background: #fff; border: 4px solid var(--rozowy); border-radius: 24px; padding: 0.5em 1em;
    font-size: clamp(20px, 3.4vw, 40px); text-align: center; opacity: 0; transition: opacity .4s;
  }
  #dymek.widoczny { opacity: 1; }
  #dalej { position: absolute; right: 4vw; bottom: 4vh; display: none; font-size: clamp(22px, 4vw, 44px); }
  #dalej.widoczny { display: inline-block; }

  /* Ekran 3: placeholder */
  #mycie { background: var(--mietowy) url(img/tlo-mycie.webp) center bottom / cover no-repeat; touch-action: none; text-align: center; }
  #mycie .instrukcja { position: absolute; top: 3vh; left: 50%; transform: translateX(-50%); font-size: clamp(18px, 3vw, 34px); background: #fff; border: 4px solid #5bc8a8; border-radius: 18px; padding: 0.3em 1em; white-space: nowrap; }
  #mycieKlient { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); --h: 82vh; }
  #piana { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); height: 82vh; width: calc(82vh * 0.7692); pointer-events: none; }
  #pasek { position: absolute; left: 4vw; bottom: 4vh; width: 30vw; height: 3.5vh; background: #fff; border: 4px solid #5bc8a8; border-radius: 999px; overflow: hidden; }
  #pasek div { height: 100%; width: 0; background: #5bc8a8; transition: width .15s; }
  #prysznic { position: absolute; font-size: clamp(60px, 11vw, 120px); transform: translate(-50%, -100%); pointer-events: none; display: none; }
  .kropla { position: absolute; width: 10px; height: 18px; background: #4aa8ff; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; pointer-events: none; animation: spada .45s linear forwards; }
  @keyframes spada { from { transform: translateY(0); opacity: 1; } to { transform: translateY(var(--spadek)); opacity: .2; } }
  #czysto { position: absolute; left: 50%; top: 14vh; transform: translateX(-50%); font-size: clamp(32px, 6vw, 70px); display: none; }
  #dalejMycie { position: absolute; right: 4vw; bottom: 4vh; display: none; font-size: clamp(22px, 4vw, 44px); }

  /* wspólne dla ekranów 4-6 */
  .instr { position: absolute; top: 3vh; left: 50%; transform: translateX(-50%); font-size: clamp(18px, 3vw, 34px); background: #fff; border: 4px solid var(--rozowy); border-radius: 18px; padding: 0.3em 1em; text-align: center; max-width: 92vw; }
  .duzy { position: absolute; left: 50%; transform: translateX(-50%); }
  /* klient: ciało + włosy (canvas) + gumki, warstwami jedna na drugiej; wysokość z --h, proporcja 650:845 */
  .klient { --h: 60vh; height: var(--h); width: calc(var(--h) * 0.7692); position: relative; }
  .klient canvas, .klient img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .dalej-prawo { position: absolute; right: 4vw; bottom: 4vh; font-size: clamp(22px, 4vw, 44px); display: none; }

  /* Ekran 4: farbowanie */
  #farbowanie { background: #f3e1ff url(img/tlo-farbowanie.webp) center bottom / cover no-repeat; }
  #farbaKlient { top: 8vh; --h: 64vh; }
  #paleta { position: absolute; left: 50%; bottom: 4vh; transform: translateX(-50%); display: flex; gap: 2vw; flex-wrap: wrap; justify-content: center; width: 70vw; }
  .kolor { width: clamp(44px, 7vw, 80px); height: clamp(44px, 7vw, 80px); border-radius: 50%; border: 5px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.2); cursor: pointer; }
  .kolor:active { transform: scale(.9); }
  .kolor.wybrany { outline: 5px solid var(--tekst); }

  /* Ekran 5: fryzura + suszarko-robot */
  #fryzura { background: #ffd6e8 url(img/tlo-fryzura.webp) center bottom / cover no-repeat; }
  #fryzuraKlient { top: 8vh; --h: 60vh; left: 36%; }
  #robot { position: absolute; right: 8vw; top: 24vh; font-size: clamp(80px, 16vw, 180px); cursor: pointer; text-align: center; line-height: 1; }
  #robot img { display: block; width: clamp(130px, 22vw, 260px); margin: 0 auto; }
  #robot small { display: block; font-size: clamp(16px, 2.4vw, 28px); background: #fff; border-radius: 14px; padding: .2em .6em; margin-top: .3em; }
  #robot.zepsuty { animation: trzes .25s infinite; }
  @keyframes trzes { 0%,100% { transform: translateX(-4px) rotate(-3deg); } 50% { transform: translateX(4px) rotate(3deg); } }
  #opcjeFryzur { position: absolute; left: 3vw; bottom: 4vh; display: none; gap: 1.5vw; flex-wrap: wrap; justify-content: flex-start; width: 62vw; }
  .opcja { border: 0; border-radius: 22px; background: #fff; border: 4px solid #6bb8ff; font: inherit; font-weight: bold; font-size: clamp(16px, 2.6vw, 30px); padding: .5em .9em; color: var(--tekst); cursor: pointer; }
  .opcja:active { transform: scale(.94); }
  .opcja.wybrany { background: #6bb8ff; color: #fff; }

  /* Ekran 6: finał */
  #koniec { background: linear-gradient(#fff3a8, #ffe3ef); text-align: center; overflow: hidden; }
  #nagroda { position: absolute; left: 40%; bottom: 40%; width: 10%; opacity: 0; transform: scale(.2) rotate(-30deg); transition: all .6s cubic-bezier(.2, 1.6, .4, 1); }
  #nagroda.pokaz { opacity: 1; transform: none; }
  #nagroda img { width: 100%; display: block; }
  #fartuszekGwiazdka { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -30%); font-size: clamp(24px, 4vw, 48px); display: none; }
  #gwiazdki { position: absolute; top: 2vh; left: 50%; transform: translateX(-50%); font-size: clamp(40px, 8vw, 90px); letter-spacing: .1em; white-space: nowrap; }
  #gwiazdki span { display: inline-block; opacity: .25; filter: grayscale(1); transition: all .4s; }
  #gwiazdki span.jest { opacity: 1; filter: none; animation: skok .6s; }
  @keyframes skok { 0% { transform: scale(.2) rotate(-90deg); } 70% { transform: scale(1.4); } 100% { transform: scale(1); } }
  #napisKoniec { position: absolute; left: 50%; bottom: 15vh; transform: translateX(-50%); width: 88vw; font-size: clamp(16px, 2.5vw, 30px); background: #fff; border: 4px solid var(--rozowy); border-radius: 22px; padding: .5em 1em; }
  #nastepny { position: absolute; left: 50%; bottom: 3vh; transform: translateX(-50%); font-size: clamp(22px, 4vw, 44px); white-space: nowrap; }
  .konfetti { position: absolute; top: -10vh; font-size: clamp(24px, 4vw, 48px); animation: leci 4s linear infinite; pointer-events: none; }
  @keyframes leci { to { transform: translateY(115vh) rotate(360deg); } }

  #dzwiekBtn { position: fixed; top: 2vh; left: 2vw; z-index: 10; font-size: clamp(24px, 4vw, 40px); background: #fff; border: 3px solid var(--rozowy); border-radius: 50%; width: 1.6em; height: 1.6em; line-height: 1; padding: 0; cursor: pointer; }

  /* zwierzak w salonie */
  .kot { position: absolute; width: min(16vh, 12vw); cursor: pointer; }
  .kot img { width: 100%; display: block; }
  .kot.skok { animation: kotSkok .5s; }
  @keyframes kotSkok { 40% { transform: translateY(-5vh) rotate(-8deg); } }
  .kot .ozdoba { position: absolute; left: 45%; top: -10%; transform: translateX(-50%); font-size: calc(max(100vw, 133.333vh) * 0.04); line-height: 1; pointer-events: none; }
  #zyczenie { position: fixed; top: 11vh; left: 2vw; z-index: 10; max-width: 46vw; font-size: clamp(16px, 2.6vw, 30px); font-weight: bold; background: #fff; border: 3px solid #b06be0; border-radius: 18px; padding: .2em .7em; display: none; }
  #monety { position: fixed; top: 2vh; right: 2vw; z-index: 10; font-size: clamp(22px, 3.6vw, 40px); font-weight: bold; background: #fff; border: 3px solid #f2b705; border-radius: 999px; padding: .15em .7em; display: none; }
  #monety.skok { animation: kotSkok .5s; }
  .guzik.maly { font-size: clamp(18px, 3vw, 32px); background: #f2b705; box-shadow: 0 6px 0 #c28f00; }
  #sklepikBtn { position: absolute; left: 4vw; bottom: 4vh; }
  #nowaMoneta { display: inline-block; }
  /* sklepik */
  #sklep { background: linear-gradient(#fff3c4, #ffd6e8); text-align: center; overflow: auto; }
  #sklep h2 { margin: 3vh 0 1vh; font-size: clamp(28px, 5vw, 56px); }
  #sklep h3 { margin: 1.5vh 0 .5vh; font-size: clamp(18px, 2.8vw, 30px); }
  .towary { display: flex; gap: 2vw; justify-content: center; flex-wrap: wrap; padding: 0 3vw; }
  .towar { width: clamp(110px, 17vw, 190px); background: #fff; border: 4px solid #f2b705; border-radius: 22px; padding: .5em .3em; font: inherit; color: var(--tekst); cursor: pointer; }
  .towar:active { transform: scale(.94); }
  .towar .ik { display: block; font-size: clamp(40px, 7vw, 76px); line-height: 1.1; }
  .towar .nz { display: block; font-weight: bold; font-size: clamp(15px, 2.2vw, 24px); }
  .towar .cn { display: block; font-size: clamp(15px, 2.2vw, 24px); }
  .towar.kupiony { border-color: #5bc8a8; }
  .towar.zalozony { background: #d9fff0; }
  .towar.brak { opacity: .55; }
  #wrocSklep { margin: 2.5vh 0 3vh; font-size: clamp(22px, 4vw, 44px); }
  .kolor.spec { border-color: #ffe27a; }
  #miau { position: absolute; font-size: clamp(18px, 2.6vw, 30px); background: #fff; border: 3px solid var(--rozowy); border-radius: 14px; padding: .1em .5em; display: none; pointer-events: none; }

  /* ---------- ruch i animacje ---------- */
  .ekran.aktywny { animation: wejscie .35s ease-out; }
  @keyframes wejscie { from { opacity: 0; } }
  @keyframes wskok { from { transform: scale(0); } 70% { transform: scale(1.15); } }
  /* postacie oddychają, krok przy wejściu, podskok po dotknięciu, taniec, dmuchanie suszarki */
  .klient > * { transform-origin: 50% 100%; animation: oddech 3.2s ease-in-out infinite; }
  @keyframes oddech { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.012, 1.02) rotate(.6deg); } }
  #mycieKlient:not(.podskok) > * { animation: none; }
  #gosc.idzie > * { animation: krok .4s ease-in-out infinite; }
  @keyframes krok { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-2.5%) rotate(2deg); } }
  .klient.podskok > * { animation: skokK .6s ease-out; }
  @keyframes skokK { 0%,100% { transform: translateY(0) scale(1); } 25% { transform: scale(1.06, .92); } 50% { transform: translateY(-5%) scale(.97, 1.05); } 75% { transform: scale(1.04, .96); } }
  .klient.dmucha > * { animation: dmuch .18s ease-in-out infinite alternate; }
  @keyframes dmuch { from { transform: rotate(-1.2deg) translateX(-.6%); } to { transform: rotate(1.2deg) translateX(.6%); } }
  #koniecKlient.tanczy > * { animation: taniec .7s ease-in-out infinite; }
  @keyframes taniec { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-3%) rotate(4deg); } }
  .zosia-s { transform-origin: 50% 100%; animation: zosiaS 4.5s ease-in-out infinite; }
  @keyframes zosiaS { 0%,60%,100% { transform: translateY(0) scaleY(1); } 70% { transform: scaleY(.97); } 80% { transform: translateY(-3%) scaleY(1.03); } 90% { transform: scaleY(.98); } }
  #start .zosia { transform-origin: 50% 100%; animation: bujaj 3s ease-in-out infinite; }
  @keyframes bujaj { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-1.2vh) rotate(1.5deg); } }
  .zosia-s.podskok, #start .zosia.podskok { animation: skokDuzy .6s ease-out; }
  @keyframes skokDuzy { 40% { transform: translateY(-7%) rotate(-5deg); } 70% { transform: translateY(0) rotate(3deg); } }
  #koniecZosia.klaszcze { animation: zosiaKlask .5s ease-in-out infinite; }
  @keyframes zosiaKlask { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-4%) rotate(2deg); } }
  .kot { transform-origin: 50% 100%; animation: kotOddech 2.8s ease-in-out infinite; }
  @keyframes kotOddech { 0%,100% { transform: rotate(-1.5deg) scaleY(1); } 50% { transform: rotate(1.5deg) scaleY(1.03); } }
  #robot { transform-origin: 50% 100%; }
  #robot.tanczy { animation: tanczRobot .6s ease-in-out infinite alternate; }
  @keyframes tanczRobot { from { transform: rotate(-6deg) translateY(0); } to { transform: rotate(6deg) translateY(-2vh); } }
  /* guziki "Dalej" zachęcają pulsowaniem */
  #graj, #dalej, #dalejMycie, .dalej-prawo { animation: puls 1.4s ease-in-out infinite; }
  @keyframes puls { 50% { transform: scale(1.07); } }
  #nastepny { animation: pulsSrodek 1.4s ease-in-out infinite; }
  @keyframes pulsSrodek { 50% { transform: translateX(-50%) scale(1.07); } }
  .kolor { animation: wskok .4s backwards; animation-delay: calc(var(--i, 0) * 50ms); }
  .kolor.wybrany { animation: puls2 1s ease-in-out infinite; }
  @keyframes puls2 { 50% { transform: scale(1.15); } }
  #opcjeFryzur .opcja { animation: wskok .4s backwards; animation-delay: calc(var(--i, 0) * 70ms); }
  .towar.wejdz { animation: wskok .45s backwards; animation-delay: calc(var(--i, 0) * 70ms); }
  .towar.wyskok { animation: skokTowar .7s ease-out; }
  @keyframes skokTowar { 30% { transform: translateY(-3vh) scale(1.1) rotate(-4deg); } 60% { transform: translateY(0) scale(.96); } }
  .towar.nie { animation: nie .4s; }
  @keyframes nie { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  /* iskry, bańki, fala koloru, nożyczki */
  .iskra { position: fixed; z-index: 20; pointer-events: none; font-size: clamp(22px, 3.4vw, 40px); animation: iskra .9s ease-out forwards; }
  @keyframes iskra { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--ob)); opacity: 0; } }
  .banka { position: fixed; z-index: 20; pointer-events: none; font-size: clamp(22px, 3vw, 36px); animation: unosi 2.6s ease-out forwards; }
  @keyframes unosi { from { transform: translate(-50%, 0) scale(.5); opacity: .9; } to { transform: translate(calc(-50% + var(--sw)), -28vh) scale(1.2); opacity: 0; } }
  .fala { position: fixed; z-index: 5; width: 22vh; height: 22vh; border-radius: 50%; pointer-events: none; opacity: .6; animation: fala .8s ease-out forwards; }
  @keyframes fala { from { transform: translate(-50%, -50%) scale(.2); opacity: .6; } to { transform: translate(-50%, -50%) scale(3); opacity: 0; } }
  .nozyczki { position: fixed; z-index: 20; pointer-events: none; font-size: clamp(40px, 7vw, 80px); animation: tnij 1s ease-in-out forwards; }
  @keyframes tnij {
    0% { transform: translate(-120%, -50%) rotate(-30deg); opacity: 0; }
    15% { opacity: 1; }
    30% { transform: translate(60%, -90%) rotate(20deg); }
    55% { transform: translate(-70%, 10%) rotate(-25deg); }
    80% { transform: translate(60%, -20%) rotate(25deg); opacity: 1; }
    100% { transform: translate(120%, -60%) rotate(40deg); opacity: 0; }
  }
  /* żywy salon: ptaki i chmury za oknem, lampy, sekundnik zegara */
  .okno { position: absolute; left: 83.5%; top: 7%; width: 16.5%; height: 19%; overflow: hidden; pointer-events: none; }
  .okno span { position: absolute; left: 100%; font-size: calc(max(100vw, 133.333vh) * .028); line-height: 1; animation: lot 9s linear infinite; }
  .okno .chmura { font-size: calc(max(100vw, 133.333vh) * .045); opacity: .85; animation-duration: 22s; }
  @keyframes lot { 0% { transform: translate(0, 0); } 50% { transform: translate(calc(max(100vw, 133.333vh) * -.11), -8%); } 100% { transform: translate(calc(max(100vw, 133.333vh) * -.22), 0); } }
  .lampa { position: absolute; top: 12.5%; width: 14%; aspect-ratio: 1; background: radial-gradient(circle, rgba(255, 226, 122, .55), transparent 65%); pointer-events: none; animation: blask 3s ease-in-out infinite; }
  @keyframes blask { 0%,100% { opacity: .35; transform: translate(-50%, -50%) scale(.9); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } }
  .zegar { position: absolute; left: 71.5%; top: 18.7%; width: .3%; height: 3.6%; margin-left: -.15%; background: #e0457b; border-radius: 4px; transform-origin: 50% 100%; pointer-events: none; animation: zegarek 12s steps(12) infinite; }
  @keyframes zegarek { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- EKRAN 1: START -->
<section id="start" class="ekran aktywny">
  <h1>Salon<br>u Róży</h1>
  <div class="podtytul">salon fryzjerski w centrum Poznania</div>
  <img class="zosia" src="img/zosia.webp" alt="Zosia fryzjerka">
  <button class="guzik" id="graj">▶ Graj</button>
  <button class="guzik maly" id="sklepStart">🛍️ Sklepik</button>
</section>

<!-- EKRAN 2: KLIENT WCHODZI -->
<section id="klient" class="ekran">
  <div class="salon">
    <img class="salon-tlo" src="img/tlo-salonu.webp" alt="">
    <img id="zosiaScena" class="zosia-s" src="img/zosia.webp" alt="Zosia">
    <div id="gosc" class="klient"></div>
    <img class="salon-lada" src="img/lada.webp" alt="">
    <div class="kot" style="left:44%;bottom:30%"></div>
  </div>
  <div class="tablica">Salon u Róży</div>
  <div id="dymek"></div>
  <button class="guzik" id="dalej">Dalej ➜</button>
</section>

<!-- EKRAN 3: MYCIE -->
<section id="mycie" class="ekran">
  <div class="instrukcja">Przeciągaj prysznic po włosach, żeby zmyć pianę!</div>
  <div id="mycieKlient" class="klient"></div>
  <svg id="piana" viewBox="0 0 650 845"></svg>
  <div id="pasek"><div></div></div>
  <div id="prysznic">🚿</div>
  <div id="czysto">Czyściutko! ✨</div>
  <button class="guzik" id="dalejMycie">Dalej ➜</button>
</section>

<!-- EKRAN 4: FARBOWANIE -->
<section id="farbowanie" class="ekran">
  <div class="instr" id="instrFarba">Wybierz kolor włosów! 🎨</div>
  <div id="farbaKlient" class="duzy klient"></div>
  <div id="paleta"></div>
  <button class="guzik dalej-prawo" id="dalejFarba">Dalej ➜</button>
</section>

<!-- EKRAN 5: FRYZURA + SUSZARKO-ROBOT -->

<script>
// ---------- dźwięki (syntezowane, bez plików) ----------
const Dzwiek = (() => {
  let ctx, wlaczony = true;
  function c() {
    if (!wlaczony) return null;
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) { return null; }
    return ctx;
  }
  function ton(f, start, dur, typ = 'sine', vol = 0.2, fKoniec) {
    const a = c(); if (!a) return;
    const t = a.currentTime + start, o = a.createOscillator(), g = a.createGain();
    o.type = typ; o.frequency.setValueAtTime(f, t);
    if (fKoniec) o.frequency.exponentialRampToValueAtTime(fKoniec, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
  }
  function szum(dur, vol, filtr) {
    const a = c(); if (!a) return;
    const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'highpass'; f.frequency.value = filtr;
    g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  // próbki z ElevenLabs (snd/*.mp3); gdy się nie wczytają, grają dźwięki syntezowane
  const probki = {}, petle = {};
  let zaladowane = false;
  function laduj() {
    if (zaladowane || !ctx) return;
    zaladowane = true;
    ['miau', 'prysznic', 'suszarka', 'nozyczki', 'robot', 'brawa'].forEach(n => {
      fetch('snd/' + n + '.mp3').then(r => r.arrayBuffer())
        .then(d => new Promise((ok, err) => ctx.decodeAudioData(d, ok, err)))
        .then(b => { probki[n] = b; }).catch(() => {});
    });
  }
  function graj(nazwa, vol = 0.8, petla = false) {
    const a = c(); if (!a || !probki[nazwa]) return null;
    const s = a.createBufferSource(), g = a.createGain();
    s.buffer = probki[nazwa]; s.loop = petla; g.gain.value = vol;
    s.connect(g); g.connect(a.destination); s.start();
    return { stop() { try { g.gain.setTargetAtTime(0, a.currentTime, 0.05); s.stop(a.currentTime + 0.3); } catch (e) {} } };
  }
  function petlaStop(nazwa) { if (petle[nazwa]) { petle[nazwa].stop(); delete petle[nazwa]; } }
  const N = { c: 523, d: 587, e: 659, g: 784, a: 880, c2: 1046 };
  return {
    odblokuj() { c(); laduj(); },
    przelacz() { wlaczony = !wlaczony; if (!wlaczony) { Object.keys(petle).forEach(petlaStop); try { speechSynthesis.cancel(); } catch (e) {} } return wlaczony; },
    // dźwięk w pętli (np. prysznic), true gdy gra próbka
    petlaStart(nazwa, vol) { if (petle[nazwa]) return true; const p = graj(nazwa, vol, true); if (p) petle[nazwa] = p; return !!p; },
    petlaStop,
    suszarka() { if (this.petlaStart('suszarka', 0.7)) setTimeout(() => petlaStop('suszarka'), 2200); },
    jestWlaczony: () => wlaczony,
    klik()    { ton(660, 0, 0.12, 'triangle', 0.2); },
    dzwonek() { ton(N.e, 0, 0.5, 'sine', 0.25); ton(N.c2, 0.15, 0.7, 'sine', 0.2); },       // drzwi salonu
    woda()    { szum(0.12, 0.12, 2500); },
    kolor(i)  { ton(400 + i * 70, 0, 0.18, 'square', 0.1); ton(600 + i * 70, 0.08, 0.2, 'triangle', 0.15); },
    stuk()    { ton(180, 0, 0.12, 'square', 0.25, 70); szum(0.08, 0.2, 1500); },
    bzzt()    { if (!graj('robot', 0.6)) ton(110, 0, 0.3, 'sawtooth', 0.12, 80); },
    naprawa() { [N.c, N.e, N.g, N.c2].forEach((n, i) => ton(n, i * 0.1, 0.3, 'triangle', 0.22)); },
    hop()     { ton(520, 0, 0.12, 'triangle', 0.18, 900); ton(780, 0.08, 0.12, 'triangle', 0.14, 1100); },
    snip()    { if (graj('nozyczki', 0.8)) return; szum(0.05, 0.3, 4000); szum(0.05, 0.3, 4500); setTimeout(() => szum(0.05, 0.3, 4000), 90); },
    gwiazdka(i) { ton(N.c * Math.pow(1.26, i), 0, 0.4, 'triangle', 0.25); ton(N.c * Math.pow(1.26, i) * 2, 0.05, 0.3, 'sine', 0.12); },
    fanfara() { [N.c, N.e, N.g, N.c2, N.g, N.c2].forEach((n, i) => ton(n, i * 0.14, 0.35, 'square', 0.1)); graj('brawa', 0.8); },
    miau()    { if (!graj('miau', 0.9)) { ton(700, 0, 0.35, 'sawtooth', 0.12, 450); ton(500, 0.05, 0.3, 'sine', 0.15, 800); } }
  };
})();
function mow(tekst) {
  if (!Dzwiek.jestWlaczony()) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(tekst);
    u.lang = 'pl-PL'; u.rate = 0.9; u.pitch = 1.2;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- zapis postępów, monety, sklepik ----------

try { Object.assign(zapis, JSON.parse(localStorage.getItem(ZAPIS_KLUCZ)) || {}); } catch (e) {}

const SKLEP = [

  { id: 'brokat',   typ: 'kolor', ikona: '✨', nazwa: 'Brokat',  cena: 16, kolor: 'brokat',  tlo: 'radial-gradient(circle at 30% 30%,#fff 0 8%,transparent 10%),radial-gradient(circle at 70% 60%,#fff 0 8%,transparent 10%),#ff8fb8' },
  { id: 'srebro',   typ: 'kolor', ikona: '🥈', nazwa: 'Srebrny', cena: 6,  kolor: '#c0c0c0', tlo: '#c0c0c0' },
  { id: 'zachod',   typ: 'kolor', ikona: '🌅', nazwa: 'Zachód',  cena: 14, kolor: 'zachod',  tlo: 'linear-gradient(135deg,#ff6b6b,#ffa94d,#ffd43b,#f06595,#845ef7)' },
  { id: 'galaktyka', typ: 'kolor', ikona: '🌌', nazwa: 'Galaktyka', cena: 18, kolor: 'galaktyka', tlo: 'linear-gradient(135deg,#1b1464,#5f27cd,#0abde3,#f368e0)' },
  { id: 'kwiatek',  typ: 'kot',   ikona: '🌸', nazwa: 'Kwiatek', cena: 5 },

];
function odswiezMonety() {
  $('monetyLiczba').textContent = zapis.monety;
  $('monety').style.display = 'block';
}
function odswiezKota() {
  const t = SKLEP.find(x => x.id === zapis.kot);
  document.querySelectorAll('.kot').forEach(k => {
    let o = k.querySelector('.ozdoba');
    if (!t) { if (o) o.remove(); return; }
    if (!o) { o = document.createElement('span'); o.className = 'ozdoba'; k.appendChild(o); }
    o.textContent = t.ikona;
  });
}
function narysujSklep() {
  let licznikT = 0;
  [['kolor', 'towaryKolor'], ['kot', 'towaryKot']].forEach(([typ, boxId]) => {
    const box = $(boxId); box.innerHTML = '';
    SKLEP.filter(x => x.typ === typ).forEach(t => {
      const ma = zapis.kupione.includes(t.id);
      const b = document.createElement('button');
      b.style.setProperty('--i', licznikT++);
      b.className = 'towar' + (sklepWejscie ? ' wejdz' : '') + (ostatniKupiony === t.id ? ' wyskok' : '') + (ma ? ' kupiony' : '') + (typ === 'kot' && zapis.kot === t.id ? ' zalozony' : '') + (!ma && zapis.monety < t.cena ? ' brak' : '');
      b.innerHTML = '<span class="ik">' + t.ikona + '</span><span class="nz">' + t.nazwa + '</span><span class="cn">' + (ma ? (typ === 'kot' ? (zapis.kot === t.id ? '✅ założone' : 'założyć') : '✅ masz') : '🪙 ' + t.cena) + '</span>';
      b.addEventListener('click', ev => {
        if (!ma) {
          if (zapis.monety < t.cena) { Dzwiek.stuk(); b.classList.remove('nie'); void b.offsetWidth; b.classList.add('nie'); return; }
          zapis.monety -= t.cena; zapis.kupione.push(t.id);
          Dzwiek.naprawa();
          ostatniKupiony = t.id;
          iskry(ev.clientX, ev.clientY, ['✨', '🪙', '💖'], 9, 14);
          if (typ === 'kot') zapis.kot = t.id;
        } else if (typ === 'kot') {
          zapis.kot = zapis.kot === t.id ? null : t.id;   // drugie stuknięcie zdejmuje ozdobę
          Dzwiek.klik();
        } else { Dzwiek.kolor(3); return; }
        zapisz(); odswiezMonety(); odswiezKota(); narysujSklep();
        if (typ === 'kot' && zapis.kot) Dzwiek.miau();

  ostatniKupiony = null; sklepWejscie = false;
}
let sklepWroc = 'start';
function otworzSklep(skad) { sklepWroc = skad; sklepWejscie = true; narysujSklep(); pokaz('sklep'); }

const GRADIENTY = {   // magiczne farby z przejściem kolorów (od czubka głowy w dół)
  tecza: ['#ff4d6d', '#ff9f1c', '#ffd93d', '#3ddc84', '#35a7ff', '#9b5de5'],
  zachod: ['#ff6b6b', '#ffa94d', '#ffd43b', '#f06595', '#845ef7'],
  galaktyka: ['#1b1464', '#5f27cd', '#0abde3', '#f368e0', '#1b1464']
};
// klient = ciało (img) + włosy (canvas, tyl i przód) + gumki (img)
let licznikMalowania = 0;
function malujKlienta(el, opis) {
  if (el.dataset.klient !== opis.klient) {
    el.dataset.klient = opis.klient;
    el.innerHTML = `<canvas class="w-tyl" width="${SZER}" height="${WYS}"></canvas>
      <img class="k-img" alt="" src="${obraz('klient-' + opis.klient).src}">
      <canvas class="w-przod" width="${SZER}" height="${WYS}"></canvas>
      <img class="gumki" alt="">`;
  }
  const tyl = el.querySelector('.w-tyl'), przod = el.querySelector('.w-przod'), gumki = el.querySelector('.gumki');
  const ct = tyl.getContext('2d'), cp = przod.getContext('2d');
  const token = el._token = ++licznikMalowania;
  ct.clearRect(0, 0, SZER, WYS); cp.clearRect(0, 0, SZER, WYS);
  gumki.style.display = 'none';
  if (opis.styl === 'lysy') return;
  const wl = obraz('wlosy-' + opis.styl);
  gdyGotowy(wl, () => {
    if (el._token !== token) return;          // w międzyczasie wybrano inną fryzurę
    const t = document.createElement('canvas'); t.width = SZER; t.height = WYS;
    const c = t.getContext('2d');
    c.drawImage(wl, 0, 0, SZER, WYS);
    c.globalCompositeOperation = 'multiply';  // szara warstwa włosów * kolor = zafarbowane włosy z cieniami
    const gr = GRADIENTY[opis.kolor];
    if (gr) {
      const g = c.createLinearGradient(0, 40, 0, 520);
      gr.forEach((k, i) => g.addColorStop(i / (gr.length - 1), k));
      c.fillStyle = g;
    } else c.fillStyle = opis.kolor === 'brokat' ? '#ff8fb8' : opis.kolor;
    c.fillRect(0, 0, SZER, WYS);
    if (opis.kolor === 'brokat') {            // stałe "losowe" iskierki, żeby brokat nie migotał przy każdym malowaniu
      c.globalCompositeOperation = 'source-over';
      let r = 7;
      for (let i = 0; i < 260; i++) {
        r = (r * 16807) % 2147483647; const x = r % SZER;
        r = (r * 16807) % 2147483647; const y = r % 560;
        c.fillStyle = i % 3 ? '#fff' : '#ffe27a';
        c.beginPath(); c.arc(x, y, 2 + (i % 4), 0, 6.3); c.fill();
      }
    }
    c.globalCompositeOperation = 'destination-in';
    c.drawImage(wl, 0, 0, SZER, WYS);
    if (WLOSY_ZA_UBRANIEM.includes(opis.styl)) {
      cp.drawImage(t, 0, 0, SZER, PODZIAL, 0, 0, SZER, PODZIAL);
      ct.drawImage(t, 0, PODZIAL, SZER, WYS - PODZIAL, 0, PODZIAL, SZER, WYS - PODZIAL);
    } else {
      cp.drawImage(t, 0, 0);
    }
  });
  if (Z_GUMKAMI.includes(opis.styl)) {
    gumki.src = obraz('gumki-' + opis.styl).src;
    gumki.style.display = 'block';
  }
}

  { imie: 'Dziadek Stefan', tekst: 'Dzień dobry! Co tu zrobić z tą łysinką?', opis: { klient: 'stefan', styl: 'lysy', kolor: '#cfcfcf' } }

// ---------- ruch i efekty (iskry, bańki, fala koloru, nożyczki, dmuchanie) ----------
let ostatniKupiony = null, sklepWejscie = false;
function iskry(x, y, znaki, n = 8, zasieg = 16) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'iskra';
    s.textContent = znaki[i % znaki.length];
    const kat = Math.random() * Math.PI * 2, d = (0.5 + Math.random() * 0.5) * zasieg * innerWidth / 100;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.setProperty('--dx', Math.cos(kat) * d + 'px');
    s.style.setProperty('--dy', Math.sin(kat) * d - 20 + 'px');
    s.style.setProperty('--ob', (Math.random() * 120 - 60) + 'deg');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}
function iskrySrodek(el, fy, znaki, n, zasieg) {
  const r = el.getBoundingClientRect();
  iskry(r.left + r.width / 2, r.top + r.height * fy, znaki, n, zasieg);
}
function podskok(el) {
  el.classList.remove('podskok'); void el.offsetWidth; el.classList.add('podskok');
  setTimeout(() => el.classList.remove('podskok'), 650);
}
function banka(x, y) {
  const b = document.createElement('div');
  b.className = 'banka'; b.textContent = '🫧';
  b.style.left = x + 'px'; b.style.top = y + 'px';
  b.style.setProperty('--sw', (Math.random() * 80 - 40) + 'px');
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 2700);
}
function fala(el, tlo) {                 // kolor rozlewa się kołem od głowy klienta
  const r = el.getBoundingClientRect(), f = document.createElement('div');
  f.className = 'fala'; f.style.background = tlo;
  f.style.left = (r.left + r.width / 2) + 'px'; f.style.top = (r.top + r.height * .22) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 850);
}
function nozyczki(el) {
  const r = el.getBoundingClientRect(), s = document.createElement('div');
  s.className = 'nozyczki'; s.textContent = '✂️';
  s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + r.height * .25) + 'px';
  document.body.appendChild(s);
  [250, 500, 750].forEach(t => setTimeout(() => iskrySrodek(el, .25, ['✨', '💫'], 3, 9), t));
  setTimeout(() => s.remove(), 1000);
}
function dmuch(el) {                     // suszarka dmucha: włosy falują, z robota lecą podmuchy
  el.classList.add('dmucha');
  const rb = $('robot').getBoundingClientRect();
  for (let i = 0; i < 4; i++) setTimeout(() => iskry(rb.left + rb.width * .3, rb.top + rb.height * .5, ['💨'], 1, 8), i * 400);
  setTimeout(() => {
    el.classList.remove('dmucha'); podskok(el); Dzwiek.hop();
    iskrySrodek(el, .25, ['😍', '💖', '✨'], 8, 14);
  }, 2200);
}

// ---------- logika ekranów ----------
const $ = id => document.getElementById(id);
function pokaz(id) {
  document.querySelectorAll('.ekran').forEach(e => e.classList.remove('aktywny'));
  $(id).classList.add('aktywny');
  const z = $('zyczenie');
  z.style.display = aktualnyKlient && aktualnyKlient.zyczenie && ['klient', 'farbowanie', 'fryzura'].includes(id) ? 'block' : 'none';
}
// życzenie klienta: kolor + fryzura; spełnione = bonusowe monety
const NAZWY_KOLOROW = ['czerwone', 'pomarańczowe', 'żółte', 'zielone', 'niebieskie', 'fioletowe', 'różowe', 'czarne', 'brązowe', 'białe'];
const NAZWY_STYLI = { krotkie: 'krótkie', dlugie: 'długie', kucyki: 'kucyki', kok: 'kok', warkocze: 'warkocze', irokez: 'irokez' };
function losujZyczenie() {
  const i = Math.floor(Math.random() * KOLORY.length);
  const styl = FRYZURY_IMG[Math.floor(Math.random() * FRYZURY_IMG.length)];
  return { kolor: KOLORY[i], nazwaKoloru: NAZWY_KOLOROW[i], styl, nazwaStylu: NAZWY_STYLI[styl] };
}

let aktualnyKlient = null;
let stan = { kolor: false, fryzura: false, robot: false };
function nowyKlient() {
  const wzor = KLIENCI[Math.floor(Math.random() * KLIENCI.length)];
  aktualnyKlient = { ...wzor, opis: { ...wzor.opis } };   // kopia, żeby farbowanie nie psuło wzoru
  stan = { kolor: false, fryzura: false, robot: false };
  aktualnyKlient.zyczenie = losujZyczenie();
  $('zyczenie').textContent = '💭 Chcę: ' + aktualnyKlient.zyczenie.nazwaKoloru + ', ' + aktualnyKlient.zyczenie.nazwaStylu;
  $('zyczenie').style.display = 'none';
  setTimeout(() => Dzwiek.dzwonek(), 300);
  const g = $('gosc');
  g.className = 'klient';
  malujKlienta(g, aktualnyKlient.opis);
  $('dymek').className = '';
  $('dalej').className = 'guzik';
  // wymuszenie reflow, żeby animacja wejścia ruszyła od początku
  void g.offsetWidth;
  g.classList.add('wszedl', 'idzie');
  setTimeout(() => { g.classList.remove('idzie'); podskok(g); Dzwiek.hop(); }, 2300);
  setTimeout(() => {
    const zy = aktualnyKlient.zyczenie;
    const tekst = aktualnyKlient.tekst + ' Chcę ' + zy.nazwaKoloru + ' włosy i ' + zy.nazwaStylu + '!';
    $('dymek').textContent = aktualnyKlient.imie + ': ' + tekst;
    $('dymek').classList.add('widoczny');
    $('dalej').className = 'guzik widoczny';
    $('zyczenie').style.display = 'block';
    mow(tekst);
  }, 2400);
}

$('graj').addEventListener('click', () => { Dzwiek.odblokuj(); Dzwiek.klik(); pokaz('klient'); nowyKlient(); });
$('dzwiekBtn').addEventListener('click', () => { $('dzwiekBtn').textContent = Dzwiek.przelacz() ? '🔊' : '🔇'; });
$('dalej').addEventListener('click', () => {
  Dzwiek.klik();
  const g = $('gosc');
  g.classList.remove('wszedl');
  g.classList.add('w-fotelu');
  $('dymek').classList.remove('widoczny');
  setTimeout(() => { pokaz('mycie'); startMycie(); }, 1100);
});

// ---------- ekran 3: mycie włosów ----------
const SVG_NS = 'http://www.w3.org/2000/svg';
let babelki = [];
let myje = false;
let kroplaCzas = 0;

function startMycie() {
  malujKlienta($('mycieKlient'), aktualnyKlient.opis);
  const piana = $('piana');
  piana.innerHTML = '';
  babelki = [];
  const lysy = aktualnyKlient.opis.styl === 'lysy';
  const ile = lysy ? 10 : 26;
  for (let i = 0; i < ile; i++) {
    // losowy punkt w elipsie na czubku głowy (tam jest piana); współrzędne obrazka 650x845
    const kat = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random());
    const x = 325 + Math.cos(kat) * r * (lysy ? 110 : 190);
    const y = (lysy ? 175 : 200) + Math.sin(kat) * r * (lysy ? 55 : 95);
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y);
    c.setAttribute('r', 30 + Math.random() * 20);
    c.setAttribute('fill', '#fff'); c.setAttribute('stroke', '#bfe6ff'); c.setAttribute('stroke-width', 5);
    piana.appendChild(c);
    babelki.push({ x, y, el: c, zycie: 1 });
  }
  $('pasek').firstElementChild.style.width = '0%';
  $('czysto').style.display = 'none';
  $('dalejMycie').style.display = 'none';
  $('prysznic').style.display = 'none';
}

function postep() {
  const suma = babelki.reduce((s, b) => s + b.zycie, 0);
  return 1 - suma / babelki.length;
}

function prysznicRuch(e) {
  if (!myje) return;
  const ekran = $('mycie').getBoundingClientRect();
  const px = e.clientX - ekran.left, py = e.clientY - ekran.top;
  const p = $('prysznic');
  p.style.display = 'block';
  p.style.left = px + 'px';
  p.style.top = (py - 40) + 'px';

  // krople lecące z prysznica do palca
  const teraz = performance.now();
  if (teraz - kroplaCzas > 40) {
    kroplaCzas = teraz;
    const k = document.createElement('div');
    k.className = 'kropla';
    k.style.left = (px + (Math.random() * 40 - 20)) + 'px';
    k.style.top = (py - 40) + 'px';
    k.style.setProperty('--spadek', '40px');
    $('mycie').appendChild(k);
    setTimeout(() => k.remove(), 450);
    if (Math.random() < 0.25) banka(e.clientX + Math.random() * 60 - 30, e.clientY);
  }

  if (!Dzwiek.petlaStart('prysznic', 0.6) && teraz - (prysznicRuch.dzwiek || 0) > 110) { prysznicRuch.dzwiek = teraz; Dzwiek.woda(); }

  // zmywanie piany w punkcie pod prysznicem (przeliczenie na współrzędne SVG)
  const r = $('piana').getBoundingClientRect();
  const sx = (e.clientX - r.left) / r.width * SZER;
  const sy = (e.clientY - r.top) / r.height * WYS;
  babelki.forEach(b => {
    if (b.zycie > 0 && Math.hypot(b.x - sx, b.y - sy) < 100) {
      b.zycie = Math.max(0, b.zycie - 0.12);
      b.el.setAttribute('opacity', b.zycie);
    }
  });
  const pr = postep();
  $('pasek').firstElementChild.style.width = Math.round(pr * 100) + '%';
  if (pr > 0.97 && $('czysto').style.display === 'none') {
    babelki.forEach(b => { b.zycie = 0; b.el.setAttribute('opacity', 0); });
    $('pasek').firstElementChild.style.width = '100%';
    $('czysto').style.display = 'block';
    Dzwiek.naprawa();
    iskrySrodek($('mycieKlient'), .3, ['✨', '💧', '🫧', '💖'], 12, 18);
    podskok($('mycieKlient'));
    $('dalejMycie').style.display = 'inline-block';
    myje = false;
    Dzwiek.petlaStop('prysznic');
    $('prysznic').style.display = 'none';
  }
}

$('mycie').addEventListener('pointerdown', e => { if (e.target.closest('button')) return; myje = true; prysznicRuch(e); });
$('mycie').addEventListener('pointermove', prysznicRuch);
['pointerup', 'pointercancel'].forEach(t => $('mycie').addEventListener(t, () => { myje = false; Dzwiek.petlaStop('prysznic'); $('prysznic').style.display = 'none'; }));
$('dalejMycie').addEventListener('click', () => { Dzwiek.klik(); pokaz('farbowanie'); startFarbowanie(); });

// ---------- ekran 4: farbowanie ----------
const KOLORY = ['#ff4d6d', '#ff9f1c', '#ffd93d', '#3ddc84', '#35a7ff', '#9b5de5', '#ff8fb8', '#2b2b2b', '#8b4513', '#ffffff'];
function startFarbowanie() {
  const o = aktualnyKlient.opis;
  $('instrFarba').textContent = 'Wybierz kolor włosów! 🎨';
  if (o.styl === 'lysy') {             // łysy klient dostaje perukę, żeby było co farbować
    o.styl = 'krotkie';
    $('instrFarba').textContent = aktualnyKlient.imie + ' dostał perukę! Pomaluj ją 🎨';
  }
  malujKlienta($('farbaKlient'), o);
  $('dalejFarba').style.display = 'none';
  const p = $('paleta');
  p.innerHTML = '';
  const wszystkie = KOLORY.map(k => ({ kolor: k, tlo: k }))
    .concat(SKLEP.filter(t => t.typ === 'kolor' && zapis.kupione.includes(t.id)).map(t => ({ kolor: t.kolor, tlo: t.tlo, spec: true })));
  wszystkie.forEach(({ kolor: k, tlo, spec }, i) => {
    const b = document.createElement('div');
    b.style.setProperty('--i', i);
    b.className = 'kolor' + (spec ? ' spec' : ''); b.style.background = tlo;
    b.addEventListener('click', () => {
      o.kolor = k;
      malujKlienta($('farbaKlient'), o);
      p.querySelectorAll('.kolor').forEach(x => x.classList.remove('wybrany'));
      b.classList.add('wybrany');
      Dzwiek.kolor(i);
      fala($('farbaKlient'), tlo);
      podskok($('farbaKlient'));
      iskrySrodek($('farbaKlient'), .25, ['🎨', '✨', '💧'], 6, 12);
      stan.kolor = true;
      $('dalejFarba').style.display = 'inline-block';
    });
    p.appendChild(b);
  });
}
$('dalejFarba').addEventListener('click', () => { Dzwiek.klik(); pokaz('fryzura'); startFryzura(); });

// ---------- ekran 5: suszarko-robot + fryzura ----------
const STYLE = [['krotkie', 'Krótkie ✂️'], ['dlugie', 'Długie 💇'], ['kucyki', 'Kucyki 🎀'], ['kok', 'Kok 🍩'], ['warkocze', 'Warkocze 🪢'], ['irokez', 'Irokez 🦔']];
let naprawy = 0;
let robotBzzt = null;
function startFryzura() {
  naprawy = 0;
  malujKlienta($('fryzuraKlient'), aktualnyKlient.opis);
  $('robot').className = 'zepsuty';
  $('robotImg').src = IMG + 'robot-zepsuty.webp';
  $('robotNapis').textContent = '⚡ bzzzt... ⚡';
  $('instrFryzura').textContent = 'Suszarko-robot się zepsuł! Stuknij go 3 razy 🔧';
  $('opcjeFryzur').style.display = 'none';
  $('dalejFryzura').style.display = 'none';
  clearInterval(robotBzzt);
  robotBzzt = setInterval(() => { if (naprawy < 3) Dzwiek.bzzt(); }, 1200);
  const box = $('opcjeFryzur');
  box.innerHTML = '';
  STYLE.forEach(([id, nazwa], i) => {
    const b = document.createElement('button');
    b.style.setProperty('--i', i);
    b.className = 'opcja'; b.textContent = nazwa;
    b.addEventListener('click', () => {
      aktualnyKlient.opis.styl = id;
      malujKlienta($('fryzuraKlient'), aktualnyKlient.opis);
      box.querySelectorAll('.opcja').forEach(x => x.classList.remove('wybrany'));
      b.classList.add('wybrany');
      Dzwiek.snip();
      nozyczki($('fryzuraKlient'));
      setTimeout(() => { Dzwiek.suszarka(); dmuch($('fryzuraKlient')); }, 700);
      stan.fryzura = true;
      $('dalejFryzura').style.display = 'inline-block';
    });
    box.appendChild(b);
  });
}
$('robot').addEventListener('click', () => {
  if (naprawy >= 3) { Dzwiek.naprawa(); return; }
  naprawy++;
  Dzwiek.stuk();
  iskrySrodek($('robot'), .4, ['🔧', '⚙️'], 3, 8);
  if (naprawy < 3) {
    $('robotNapis').textContent = '🔧 jeszcze ' + (3 - naprawy) + '...';
  } else {
    clearInterval(robotBzzt);
    $('robot').className = 'tanczy';
    iskrySrodek($('robot'), .4, ['⚙️', '✨', '⭐', '💖'], 12, 16);
    $('robotImg').src = IMG + 'robot-dziala.webp';
    $('robotNapis').textContent = '✨ działa! ✨';
    $('instrFryzura').textContent = 'Hura! Teraz wybierz fryzurę ✂️';
    $('opcjeFryzur').style.display = 'flex';
    stan.robot = true;
    setTimeout(() => Dzwiek.naprawa(), 150);
  }
});
$('dalejFryzura').addEventListener('click', () => { clearInterval(robotBzzt); Dzwiek.klik(); pokaz('koniec'); startKoniec(); });

// ---------- ekran 6: zadowolony klient, gwiazdki, fartuszek ----------
function startKoniec() {
  malujKlienta($('koniecKlient'), aktualnyKlient.opis);
  $('koniecKlient').classList.remove('tanczy'); $('koniecZosia').classList.remove('klaszcze');
  const gwiazdy = 1 + (stan.kolor ? 1 : 0) + (stan.fryzura ? 1 : 0) + (stan.robot ? 1 : 0);
  const sp = $('gwiazdki').children;
  [...sp].forEach(s => s.classList.remove('jest'));
  for (let i = 0; i < gwiazdy; i++) {
    setTimeout(() => { sp[i].classList.add('jest'); Dzwiek.gwiazdka(i); }, 500 + i * 600);
  }
  // nowy fartuszek dla Zosi (4 gwiazdki = złota gwiazdka)
  fartuszek.nr = (fartuszek.nr + 1) % FARTUSZEK_ODCIEN.length;
  fartuszek.gwiazdka = gwiazdy === 4;
  const zy = aktualnyKlient.zyczenie, o = aktualnyKlient.opis;
  const trafKolor = o.kolor === zy.kolor, trafStyl = o.styl === zy.styl;
  const bonus = (trafKolor ? 3 : 0) + (trafStyl ? 3 : 0);
  const zarobek = gwiazdy * 2 + bonus;
  zapis.monety += zarobek; zapis.fartuszek = fartuszek.nr; zapisz();
  const nag = $('nagroda');
  nag.classList.remove('pokaz'); void nag.offsetWidth;
  $('fartuszekImg').style.filter = 'hue-rotate(' + FARTUSZEK_ODCIEN[fartuszek.nr] + 'deg)';
  $('fartuszekGwiazdka').style.display = fartuszek.gwiazdka ? 'block' : 'none';
  setTimeout(() => nag.classList.add('pokaz'), 500 + gwiazdy * 600);
  $('napisKoniec').innerHTML = aktualnyKlient.imie + ': „Super! Dziękuję!” 😍 Zosia dostaje <b>nowy fartuszek</b>! 👗<br>Fryzura jedzie na <b>Konkurs Fryzur w Poznaniu</b> 🏆<br>' + (bonus ? '💝 Spełnione życzenie: ' + [trafKolor ? zy.nazwaKoloru : '', trafStyl ? zy.nazwaStylu : ''].filter(Boolean).join(' i ') + '! ' : 'Życzenie: ' + zy.nazwaKoloru + ', ' + zy.nazwaStylu + '. ') + 'Napiwek: <b>+' + zarobek + ' 🪙</b>';
  setTimeout(() => {
    Dzwiek.fanfara(); mow('Super! Dziękuję!');
    $('koniecKlient').classList.add('tanczy'); $('koniecZosia').classList.add('klaszcze');
    iskrySrodek($('koniecKlient'), .3, ['💖', '🪙', '⭐', '😍'], 14, 22);
    odswiezMonety(); $('monety').classList.remove('skok'); void $('monety').offsetWidth; $('monety').classList.add('skok');
  }, 500 + gwiazdy * 600);
  for (let i = 0; i < 14; i++) {
    const k = document.createElement('div');
    k.className = 'konfetti';
    k.textContent = ['✨', '🎉', '💖', '⭐'][i % 4];
    k.style.left = (Math.random() * 95) + 'vw';
    k.style.animationDelay = (Math.random() * 4) + 's';
    $('koniec').appendChild(k);
  }
}
$('nastepny').addEventListener('click', () => {
  Dzwiek.klik();
  document.querySelectorAll('.konfetti').forEach(k => k.remove());
  pokaz('klient'); nowyKlient();
});
$('sklepStart').addEventListener('click', () => { Dzwiek.odblokuj(); Dzwiek.klik(); otworzSklep('start'); });
$('sklepikBtn').addEventListener('click', () => { Dzwiek.klik(); otworzSklep('koniec'); });
$('wrocSklep').addEventListener('click', () => { Dzwiek.klik(); pokaz(sklepWroc); });
// dotknięcie klienta albo Zosi = podskok i iskry
document.querySelectorAll('.klient').forEach(k => {
  if (k.id === 'mycieKlient') return;          // tam przeciąga się prysznic
  k.addEventListener('click', () => { podskok(k); Dzwiek.hop(); iskrySrodek(k, .25, ['😆', '💖', '✨'], 5, 10); });
});
document.querySelectorAll('.zosia-s, #start .zosia').forEach(z => {
  z.addEventListener('click', () => { podskok(z); Dzwiek.hop(); iskrySrodek(z, .3, ['💖', '✨'], 5, 10); });
});
// żywy salon: ptaki i chmury w oknie, blask lamp, sekundnik zegara
document.querySelectorAll('.salon').forEach(s => {
  s.querySelector('.salon-tlo').insertAdjacentHTML('afterend',
    '<div class="okno"><span class="chmura" style="top:5%;animation-delay:-3s">☁️</span><span class="chmura" style="top:45%;animation-duration:28s;animation-delay:-14s">☁️</span>' +
    '<span style="top:20%;animation-delay:-1s">🐦</span><span style="top:55%;animation-duration:7s;animation-delay:-5s">🕊️</span></div>' +
    '<div class="lampa" style="left:24.8%"></div><div class="lampa" style="left:75.3%;animation-delay:-1.2s"></div><div class="zegar"></div>');
});
// co chwilę: bańki nad głową w myciu, iskry z zepsutego robota, kot sam podskakuje
setInterval(() => {
  if (document.hidden) return;
  const a = document.querySelector('.ekran.aktywny'); if (!a) return;
  if (a.id === 'mycie' && $('czysto').style.display !== 'block') {
    const r = $('piana').getBoundingClientRect();
    banka(r.left + r.width * (.3 + Math.random() * .4), r.top + r.height * (.15 + Math.random() * .15));
  }
  if (a.id === 'fryzura' && $('robot').classList.contains('zepsuty')) iskrySrodek($('robot'), .4, ['⚡', '✨'], 2, 6);
  if ((a.id === 'klient' || a.id === 'koniec') && Math.random() < .2) {
    const k = a.querySelector('.kot');
    if (k) { k.classList.add('skok'); setTimeout(() => k.classList.remove('skok'), 550); }
  }
}, 800);
odswiezMonety(); odswiezKota();
if ('serviceWorker' in navigator) {   // PWA: działa offline po pierwszym wejściu
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
